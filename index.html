        <h1 style="font-size: 28px; font-weight: 800; margin-bottom: 8px;">Privacy Policy - Jeetk Delivery (جيتك)</h1>
        <p style="color: #71717a; font-size: 14px;">Last updated: August 28, 2026</p>

        <h2>1. Introduction</h2>
        <p>Jeetk is an on-demand food, beverage, and parcel delivery service connecting customers, merchants, and delivery couriers. This Privacy Policy applies to the Jeetk mobile application (Android / Google Play) and website (https://jeetk.com).</p>
        
        <h2>2. Data We Collect</h2>
        <p>We collect account data (name, email, phone number), order details, delivery addresses, location data (foreground for customers to set delivery address, foreground/background for drivers on active routes to track delivery), and camera/photo uploads for invoice proof.</p>
        
        <h2>3. Location Information Prominent Disclosure</h2>
        <p>Jeetk accesses precise/approximate location data solely to determine delivery addresses, compute delivery prices, and provide real-time order tracking. Users can manage location permissions at any time in device settings.</p>
        
        <h2>4. Account and Data Deletion</h2>
        <p>Users can permanently delete their account and personal data directly in the app via Dashboard &gt; Profile &gt; Account Settings &gt; Delete Account, or by emailing <strong>support@jeetk.com</strong> (or <strong>binsabbah2013@gmail.com</strong>). Requests are completed within 30 days.</p>
        
        <h2>5. Contact Information</h2>
        <p>For privacy inquiries, contact: <strong>support@jeetk.com</strong></p>
